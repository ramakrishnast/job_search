services:
  jobpilot:
    build: .
    image: jobpilot:local
    container_name: jobpilot
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    ports:
      # Bound to localhost only: single-user app with no login.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data            # SQLite DB, exports, whiteboard images, backups (gitignored)
      - ./config:/app/config:ro # edit companies/filters without rebuilding
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
