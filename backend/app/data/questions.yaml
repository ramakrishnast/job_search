  - key: code-json-repair
    category: coding
    topic: llm_api
    difficulty: 2
    function_name: generate_validated
    prompt: |
      Implement `generate_validated(call_model, required_keys, max_attempts=3)`.
      `call_model(messages)` takes a list of `{"role", "content"}` dicts and returns a string.
      Start with `[{"role": "user", "content": "Return JSON"}]`. Parse the response as JSON (it may be wrapped in
      ```json fences). It is valid if it is an object containing every key in `required_keys`.
      On invalid output append the assistant reply and a user message whose content starts with "Invalid:" and
      describes the problem, then retry. Return the parsed dict, or raise ValueError after max_attempts.
    starter_code: |
      import json


      def generate_validated(call_model, required_keys, max_attempts=3):
          raise NotImplementedError
    tests: |
      from solution import generate_validated

      def test_valid_first():
          out = generate_validated(lambda m: '{"a": 1, "b": 2}', ["a", "b"])
          assert out == {"a": 1, "b": 2}

      def test_fenced_and_retry():
          replies = iter(["not json", '```json\n{"a": 1}\n```', '{"a": 1, "b": 2}'])
          seen = []
          def call(messages):
              seen.append([dict(x) for x in messages])
              return next(replies)
          out = generate_validated(call, ["a", "b"])
          assert out == {"a": 1, "b": 2}
          assert len(seen) == 3
          assert seen[1][-1]["role"] == "user" and seen[1][-1]["content"].startswith("Invalid:")
          assert seen[1][-2] == {"role": "assistant", "content": "not json"}

      def test_gives_up():
          try:
              generate_validated(lambda m: "[]", ["a"], max_attempts=2)
              assert False
          except ValueError:
              pass

  - key: code-rrf
    category: coding
    topic: retrieval
    difficulty: 2
    function_name: reciprocal_rank_fusion
    prompt: |
      Implement `reciprocal_rank_fusion(rankings, k=60, top_n=None)` to merge results from hybrid search
      (e.g. BM25 + dense). `rankings` is a list of ranked lists of doc ids (best first). Each doc's score is
      the sum over lists of 1 / (k + rank), with rank starting at 1. Return doc ids sorted by score descending,
      ties broken by first appearance across the input lists (scanning list by list). Duplicates within one list
      are ignored after their first occurrence (they do not consume a rank). Truncate to top_n if given.
    starter_code: |
      def reciprocal_rank_fusion(rankings, k=60, top_n=None):
          raise NotImplementedError
    tests: |
      from solution import reciprocal_rank_fusion

      def test_basic():
          r = reciprocal_rank_fusion([["a", "b", "c"], ["b", "c", "d"]])
          assert r[0] == "b"
          assert set(r) == {"a", "b", "c", "d"}
          assert r.index("c") < r.index("a")

      def test_ties_by_first_appearance():
          assert reciprocal_rank_fusion([["x"], ["y"]]) == ["x", "y"]

      def test_duplicates_and_top_n():
          assert reciprocal_rank_fusion([["a", "a", "b"], ["b"]], k=1, top_n=1) == ["b"]
          full = reciprocal_rank_fusion([["a", "a", "b"], ["b"]], k=1)
          # a: 1/2 ; b: 1/3 (rank 2 after dedupe) + 1/2
          assert full == ["b", "a"]
