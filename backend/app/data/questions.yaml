  # ------------------------------------------------------------ Coding (Python, LLM-API flavored)
  - key: code-retry-backoff
    category: coding
    topic: llm_api
    difficulty: 1
    function_name: call_with_retries
    prompt: |
      Implement `call_with_retries(fn, max_attempts=4, base_delay=0.5, sleep=time.sleep)`.
      Call `fn()` and return its result. If it raises `RetryableError`, wait `base_delay * 2**attempt`
      seconds (attempt starts at 0) using the injected `sleep`, then retry, up to `max_attempts` total calls.
      Any other exception propagates immediately. If all attempts fail, re-raise the last RetryableError.
    starter_code: |
      import time


      class RetryableError(Exception):
          pass


      def call_with_retries(fn, max_attempts=4, base_delay=0.5, sleep=time.sleep):
          # your code here
          raise NotImplementedError
    tests: |
      from solution import call_with_retries, RetryableError

      def test_success_first_try():
          assert call_with_retries(lambda: 42, sleep=lambda s: None) == 42

      def test_retries_then_succeeds():
          calls, sleeps = [], []
          def fn():
              calls.append(1)
              if len(calls) < 3:
                  raise RetryableError("429")
              return "ok"
          assert call_with_retries(fn, sleep=sleeps.append) == "ok"
          assert sleeps == [0.5, 1.0]

      def test_gives_up():
          sleeps = []
          def fn():
              raise RetryableError("overloaded")
          try:
              call_with_retries(fn, max_attempts=3, base_delay=1, sleep=sleeps.append)
              assert False, "should raise"
          except RetryableError:
              pass
          assert sleeps == [1, 2]

      def test_non_retryable_propagates():
          sleeps = []
          def fn():
              raise ValueError("bad request")
          try:
              call_with_retries(fn, sleep=sleeps.append)
              assert False, "should raise"
          except ValueError:
              pass
          assert sleeps == []

  - key: code-chunk-text
    category: coding
    topic: rag
    difficulty: 1
    function_name: chunk_words
    prompt: |
      Implement `chunk_words(text, chunk_size, overlap)` for a RAG ingestion pipeline.
      Split `text` on whitespace into words and return a list of chunks (strings joined by a single space),
      each with at most `chunk_size` words, where consecutive chunks share exactly `overlap` words.
      The last chunk may be shorter. Empty text returns []. Raise ValueError if overlap >= chunk_size or chunk_size < 1.
      Do not emit a final chunk that contains only words already covered by the previous chunk.
    starter_code: |
      def chunk_words(text: str, chunk_size: int, overlap: int) -> list[str]:
          raise NotImplementedError
    tests: |
      from solution import chunk_words

      def test_basic():
          assert chunk_words("a b c d e", 2, 0) == ["a b", "c d", "e"]

      def test_overlap():
          assert chunk_words("a b c d e f", 3, 1) == ["a b c", "c d e", "e f"]

      def test_exact_fit_no_redundant_tail():
          assert chunk_words("a b c d", 2, 1) == ["a b", "b c", "c d"]

      def test_empty():
          assert chunk_words("   ", 3, 1) == []

      def test_invalid():
          for args in [(2, 2), (0, 0), (3, 5)]:
              try:
                  chunk_words("a b c", *args)
                  assert False
              except ValueError:
                  pass

  - key: code-sse-parse
    category: coding
    topic: llm_api
    difficulty: 2
    function_name: collect_stream_text
    prompt: |
      An LLM API streams Server-Sent Events. Implement `collect_stream_text(lines)` which takes an iterable of
      raw lines (strings, without trailing newlines) and returns the concatenated text.
      Events are separated by blank lines. Each event has an optional `event: <name>` line and one or more
      `data: <json>` lines (multiple data lines are joined with "\n" before JSON-decoding).
      Only events whose JSON has `"type": "content_block_delta"` and `delta.type == "text_delta"` contribute
      `delta.text`. Ignore comment lines starting with ":". Stop when an event with `"type": "message_stop"` arrives.
      If the stream contains `"type": "error"`, raise RuntimeError with the error message.
    starter_code: |
      import json


      def collect_stream_text(lines) -> str:
          raise NotImplementedError
    tests: |
      from solution import collect_stream_text

      def ev(obj, name=None):
          import json
          out = []
          if name:
              out.append(f"event: {name}")
          out.append("data: " + json.dumps(obj))
          out.append("")
          return out

      def test_basic_text():
          lines = (ev({"type": "message_start"}, "message_start")
                   + ev({"type": "content_block_delta", "delta": {"type": "text_delta", "text": "Hel"}})
                   + [": keep-alive", ""]
                   + ev({"type": "content_block_delta", "delta": {"type": "text_delta", "text": "lo"}})
                   + ev({"type": "message_stop"})
                   + ev({"type": "content_block_delta", "delta": {"type": "text_delta", "text": "IGNORED"}}))
          assert collect_stream_text(lines) == "Hello"

      def test_ignores_other_deltas():
          lines = (ev({"type": "content_block_delta", "delta": {"type": "input_json_delta", "partial_json": "{"}})
                   + ev({"type": "content_block_delta", "delta": {"type": "text_delta", "text": "x"}}))
          assert collect_stream_text(lines) == "x"

      def test_multiline_data():
          lines = ['data: {"type": "content_block_delta",', 'data: "delta": {"type": "text_delta", "text": "ok"}}', ""]
          assert collect_stream_text(lines) == "ok"

      def test_error_event():
          lines = ev({"type": "error", "error": {"type": "overloaded_error", "message": "Overloaded"}})
          try:
              collect_stream_text(lines)
              assert False
          except RuntimeError as e:
              assert "Overloaded" in str(e)

  - key: code-token-bucket
    category: coding
    topic: llm_platform
    difficulty: 2
    function_name: TokenBucket
    prompt: |
      Implement a `TokenBucket(capacity, refill_per_second, clock)` rate limiter for an LLM gateway.
      `clock()` returns the current time in seconds (injected for testing). The bucket starts full.
      `try_acquire(tokens=1) -> bool` refills based on elapsed time (never above capacity), then consumes
      `tokens` and returns True if enough are available, otherwise returns False and consumes nothing.
      Requests larger than capacity always return False.
    starter_code: |
      class TokenBucket:
          def __init__(self, capacity: float, refill_per_second: float, clock):
              raise NotImplementedError

          def try_acquire(self, tokens: float = 1) -> bool:
              raise NotImplementedError
    tests: |
      from solution import TokenBucket

      class Clock:
          def __init__(self):
              self.t = 0.0
          def __call__(self):
              return self.t

      def test_starts_full_and_drains():
          c = Clock(); b = TokenBucket(3, 1, c)
          assert [b.try_acquire() for _ in range(4)] == [True, True, True, False]

      def test_refill():
          c = Clock(); b = TokenBucket(2, 1, c)
          assert b.try_acquire(2)
          assert not b.try_acquire()
          c.t = 1.5
          assert b.try_acquire()
          assert not b.try_acquire()
          c.t = 2.0
          assert b.try_acquire()

      def test_cap_and_large_requests():
          c = Clock(); b = TokenBucket(5, 10, c)
          c.t = 100
          assert not b.try_acquire(6)
          assert b.try_acquire(5)
          assert not b.try_acquire(0.5)

