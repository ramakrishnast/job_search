    rubric_hints: ["golden datasets & sourcing from production", "LLM-as-judge calibration against humans", "regression gates in CI", "slice-based metrics", "online A/B and guardrail metrics", "cost of evals"]
    follow_up_hints: ["How do you know your LLM judge is trustworthy?", "How do you avoid overfitting prompts to the eval set?"]
  - key: sd-llm-gateway
    category: system_design
    topic: llm_platform
    difficulty: 2
    prompt: "Design an internal LLM gateway used by 50 product teams: model routing, rate limits, caching, cost attribution and fallbacks."
