  # ------------------------------------------------------------ LLM system design
  - key: sd-rag-10m
    category: system_design
    topic: rag
    difficulty: 3
    prompt: "Design a retrieval-augmented generation system over 10 million enterprise documents (PDFs, wikis, tickets) with per-user access control. Target p95 latency under 3 seconds."
    rubric_hints: ["ingestion & chunking strategy", "hybrid retrieval (BM25 + dense)", "ACL enforcement at retrieval time", "reranking", "index sharding & freshness", "evals for retrieval and answer quality", "cost per query"]
    follow_up_hints: ["How do you keep the index fresh when documents change hourly?", "How do you prevent leaking documents a user cannot see?", "How would you measure retrieval recall without labels?"]
  - key: sd-multi-agent-support
    category: system_design
    topic: agents
    difficulty: 3
    prompt: "Design a multi-agent customer support system that resolves tickets end to end: it can look up orders, issue refunds under a limit, and escalate to humans."
    rubric_hints: ["supervisor vs. router topology", "tool contracts & permissions", "human-in-the-loop thresholds", "state & memory", "guardrails for money-moving actions", "observability & replay", "offline + online evals"]
    follow_up_hints: ["What stops an agent from issuing a refund twice?", "How do you debug a bad conversation in production?", "When would you NOT use multiple agents?"]
  - key: sd-eval-pipeline
    category: system_design
    topic: evals
    difficulty: 2
